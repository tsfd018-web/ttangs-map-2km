function recalc(){const ok=DATA.filter(r=>r.geo).length,fail=DATA.length-ok;$('ok').textContent=ok.toLocaleString();$('fail').textContent=fail.toLocaleString();$('bar').style.width=Math.round(ok/DATA.length*100)+'%';$('stat').innerHTML=`확정 <b>${ok}</b> / ${DATA.length} · 미확정 <b>${fail}</b>`;$('fails').innerHTML=DATA.filter(r=>!r.geo).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.base)}</td></tr>`).join('')||'<tr><td colspan="2">미확정 없음</td></tr>';applyFilter()}
function applyFilter(){const q=$('q').value.toLowerCase().trim(),reg=$('region').value;const bs=[];DATA.forEach(r=>{if(!r.geo)return;const show=(!q||[r.name,r.original,r.base].join(' ').toLowerCase().includes(q))&&(!reg||r.province===reg);if(show){if(!map.hasLayer(r.marker))marks.addLayer(r.marker);if(!map.hasLayer(r.circle))circles.addLayer(r.circle);bs.push([r.geo.lat,r.geo.lon])}else{if(map.hasLayer(r.marker))marks.removeLayer(r.marker);if(map.hasLayer(r.circle))circles.removeLayer(r.circle)}});return bs}
async function run(unresolvedOnly=false){if(running)return;running=true;$('run').disabled=$('retry').disabled=true;const todo=unresolvedOnly?DATA.filter(r=>!r.geo):DATA;let i=0;for(const r of todo){i++;$('stat').textContent=`${unresolvedOnly?'미확정 재시도':'좌표확정'} ${i}/${todo.length} · ${r.name}`;const g=await geocode(r,unresolvedOnly);if(g)add(r,g);recalc()}running=false;$('run').disabled=$('retry').disabled=false;recalc();const bs=applyFilter();if(bs.length)map.fitBounds(bs,{padding:[25,25]})}
function csv(){const lines=[['거래처코드','거래처명','기준주소','위도','경도','제공자','검색어','score','상태'].join(',')];for(const r of DATA){const v=[r.code,r.name,r.base,r.geo?.lat??'',r.geo?.lon??'',r.geo?.provider??'',r.geo?.query??'',r.geo?.score??'',r.geo?'확정':'미확정'];lines.push(v.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(','))}const b=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ESA001M_2km_좌표결과_v4.csv';a.click()}
[...new Set(DATA.map(r=>r.province).filter(Boolean))].forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;$('region').appendChild(o)});$('run').onclick=()=>run(false);$('retry').onclick=()=>run(true);$('fit').onclick=()=>{const b=applyFilter();if(b.length)map.fitBounds(b,{padding:[25,25]})};$('csv').onclick=csv;$('q').oninput=applyFilter;$('region').onchange=applyFilter;for(const r of DATA){const c=getc(r);if(c&&valid(c.lat,c.lon))add(r,c)}recalc();
</script></body></html>
